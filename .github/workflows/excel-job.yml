name: Gmail SQLite Automation

on:

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:

  run-job:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Pull Latest

        run: |

          git pull origin main || true


      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 17


      - name: Create Folders

        run: |

          mkdir -p input
          mkdir -p output
          mkdir -p github-actions-db
          mkdir -p db-backups
          mkdir -p processed
          mkdir -p logs


      - name: Build

        run: |

          mvn clean package -DskipTests


      - name: Run Automation

        env:

          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}

          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

        run: |

          java -jar target/gmail-sqlite-automation-1.0.0.jar


      - name: Commit Database

        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add github-actions-db || true
          git add db-backups || true
          git add processed || true

          git commit -m "update sqlite db" || true

          git push origin main || true


      - name: Upload Artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: automation-files

          path: |

            github-actions-db

            db-backups

            processed

            output
