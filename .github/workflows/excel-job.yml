name: Gmail SQLite Automation

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:

  run-job:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 17


      - name: Create Folders

        run: |

          mkdir -p input
          mkdir -p output
          mkdir -p github-actions-db
          mkdir -p db-backups
          mkdir -p processed
          mkdir -p logs


      - name: Build

        run: |

          mvn clean package -DskipTests


      - name: Run Automation

        env:

          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}

          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

        run: |

          java -jar target/gmail-sqlite-automation-1.0.0.jar


      - name: Upload Files

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: automation-files

          compression-level: 0

          overwrite: true

          path: |

            github-actions-db

            db-backups

            processed

            output

            logs
